<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Loader</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            background: #000;
            color: #fff;
            border-radius: 8px;
        }

        #loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255,255,255,0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .loader-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        /* ganti src img di bawah kalo mau test sama logo asli */
        .loader-logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            background: #ddd;
            border-radius: 50%;
        }

        .loader-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #ddd;
            border-top: 4px solid #000;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <button onclick="tampilkan()">Tampilkan Loader</button>

    <div id="loader">
        <div class="loader-content">
            <img class="loader-logo" src="" alt="Logo">
            <div class="loader-spinner"></div>
        </div>
    </div>

    <script>
        function tampilkan() {
            document.getElementById('loader').style.display = 'flex';

            // otomatis hilang setelah 3 detik
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 3000);
        }
    </script>

</body>
</html>
